name: Codes-barres du catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-barcodes.mjs'
      - '.github/workflows/barcodes.yml'

permissions:
  contents: write

concurrency:
  group: import-catalogue
  cancel-in-progress: false

jobs:
  barcodes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recherche des codes-barres
        run: node scripts/fetch-barcodes.mjs
      - name: Fusion du catalogue
        run: node scripts/merge-catalogue.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/barcodes.json public/data/products.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Catalogue : codes-barres"
            git pull --rebase
            git push
          fi
